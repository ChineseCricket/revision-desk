<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文返修审阅台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand"><span class="logo">R</span><div><strong>论文返修审阅台</strong><small id="projectName">本地协作工作区</small></div></div><div id="summary"></div><div class="top-actions"><input id="actor" aria-label="审阅者名称" placeholder="您的称呼" value="作者"><button id="refresh">刷新历史</button><button id="export">导出审阅记录</button></div></header>
<div id="warning" hidden></div>
<main>
<aside class="navigation"><div class="nav-top"><input id="search" type="search" placeholder="搜索原文、改文、编号…" aria-label="搜索修改"><div class="segmented"><button id="byTask" class="active">按任务</button><button id="byIssue">按审稿意见</button></div><select id="status" aria-label="筛选状态"><option value="next_round" selected>本轮需我审阅 / 输入</option><option value="all">全部审阅状态（含已处理）</option><option value="pending">待审阅</option><option value="needs_revision">要求修改</option><option value="needs_info">待补信息</option><option value="accepted">已接受</option><option value="rejected">已拒绝</option><option value="unlocated">未定位到PDF</option><option value="change">正文与图表修改</option><option value="reply">审稿回复草稿</option><option value="withdrawn">旧提案（已撤回／合并）</option></select></div><div id="groups"></div><div class="nav-bottom">接受提案后仍须落实与核验。<br>审阅进度与任务验收分别记录。</div></aside>
<section class="reader"><div class="reader-toolbar"><div><strong id="groupTitle">原文阅读</strong><small id="groupProgress"></small></div><div class="reader-controls"><select id="documentVersion" aria-label="阅读版本"><option value="original">送审原稿</option><option value="current">当前稿件</option></select><button id="prevPage" aria-label="上一页">‹</button><select id="page" aria-label="选择阅读页"></select><button id="nextPage" aria-label="下一页">›</button><button id="zoom" aria-label="放大原文">100%</button><button id="mode">查看源文</button></div></div><div id="groupDescription" hidden></div><div class="reader-notice" id="readerNotice"></div><div id="paperScroll"><div id="paper"></div></div><div class="queue-header"><strong id="queueTitle">修改提案</strong><span>点击列表或原文标记进入讨论</span><button id="batch">批量审阅…</button><button id="closeGroup" hidden>验收此组</button></div><div id="queue"></div></section>
<aside class="discussion"><div id="empty">从原文标注或列表中选择一项修改。</div><div id="detail" hidden><div class="detail-head"><span id="itemId"></span><button id="copyLink">复制此点链接</button><h2 id="itemTitle"></h2><div id="tags"></div><div id="itemState"></div></div><div class="tabs"><button data-tab="proposal" class="active">修改方案</button><button data-tab="history">讨论历史 <span id="historyCount"></span></button><button data-tab="document">完整方案</button></div><div id="detailContent"></div><div class="compose"><label for="comment">讨论 / 审批说明</label><textarea id="comment" rows="3" placeholder="写下意见、建议改文，或需要补充的证据…"></textarea><div class="comment-row"><button id="postComment">保存评论</button><button id="needsRevision">要求修改</button><button id="needsInfo">需补信息</button></div><div class="decision-row"><button id="accept" class="primary">接受提案</button><button id="reject" class="danger">拒绝</button><button id="reopen">恢复待审</button></div><div class="secondary-row"><button id="nextItem">下一待审项 →</button><details><summary>落实与核验</summary><p>填写实际改文位置或验证证据，再登记进度。</p><button id="applied">登记已落实</button><button id="verified">登记已核验</button></details></div><div id="saveStatus" role="status">审批与评论保存到本机项目，自动保留每次变更。</div></div></div></aside>
</main><dialog id="batchDialog"><h2>批量审阅当前筛选结果</h2><p>核对下列具体提案，取消不想一起处理的项。每一项都会保留独立审批记录。</p><div id="batchList"></div><select id="batchValue" aria-label="批量审批决定"><option value="accepted">接受所选提案</option><option value="rejected">拒绝所选提案</option><option value="needs_revision">要求修改</option><option value="needs_info">需补信息</option><option value="pending">恢复待审</option></select><textarea id="batchNote" placeholder="批量审批说明（可选）"></textarea><div><button id="batchCancel">取消</button><button id="batchCommit">确认并保存所选项</button></div></dialog><div id="toast" role="alert" hidden></div><script type="module" src="/app.js"></script>
</body></html>
